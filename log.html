<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workout Log | FitPath</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tracking.css"></head><body><header class="track-header"><a class="track-logo" href="index.html">Fit<span>Path</span></a><nav class="track-desktop" aria-label="Main navigation"><a href="calendar.html">Calendar</a><a href="exercises.html">Exercises</a><a href="review.html">Review</a><a href="log.html" aria-current="page">Log</a><a href="progress.html">Progress</a></nav></header><main class="track-main"><p class="track-eyebrow">WORKOUT JOURNAL</p><h1>Log your workout.</h1><p class="track-subtitle">Track each set and see your progress over time. Your entries stay on this device.</p><section class="track-panel" aria-labelledby="entry-heading"><h2 id="entry-heading">Add a set</h2><form id="logForm" class="track-form"><label>Workout date<input id="date" type="date" required></label><label>Exercise<select id="exercise" required><option value="">Choose an exercise</option></select></label><label>Set number<input id="setNumber" type="number" min="1" max="50" step="1" value="1" required></label><label>Repetitions<input id="reps" type="number" min="1" max="1000" step="1" placeholder="e.g. 10" required></label><label>Weight (lb)<input id="weight" type="number" min="0" max="10000" step="0.5" placeholder="0 for bodyweight" required></label><div class="track-form-actions"><button class="track-button" type="submit">Save set</button><button class="track-button track-secondary" type="reset">Clear form</button></div></form><p id="logMessage" class="track-message" role="status" aria-live="polite"></p></section><section class="track-panel" aria-labelledby="history-heading"><div class="track-section-head"><h2 id="history-heading">Workout history</h2><label class="track-filter">Filter exercise<select id="historyFilter"><option value="">All exercises</option></select></label></div><div id="historyList" class="track-history"></div></section></main><nav class="track-bottom" aria-label="Mobile navigation"><a href="index.html">Home</a><a href="calendar.html">Plan</a><a href="exercises.html">Exercises</a><a href="log.html" aria-current="page">Log</a><a href="progress.html">Progress</a></nav><script src="tracking-core.js"></script><script src="log.js"></script></body></html>
